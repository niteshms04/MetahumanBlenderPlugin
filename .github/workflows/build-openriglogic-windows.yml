
name: Build OpenRigLogic for Blender - Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
          architecture: "x64"

      - name: Verify build tools
        shell: pwsh
        run: |
          cmake --version
          swig -version
          python --version

          $include = python -c "import sysconfig; print(sysconfig.get_path('include'))"

          if (!(Test-Path (Join-Path $include "Python.h"))) {
            throw "Python development headers not found."
          }

          if (!(Test-Path "third_party/openriglogic/CMakeLists.txt")) {
            throw "OpenRigLogic submodule missing."
          }

      - name: Patch OpenRigLogic for Blender Python modules
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path

          operations = [
              (
                  Path("third_party/openriglogic/python/dna/CMakeLists.txt"),
                  "${PYDNA}",
                  "PYDNA_PYTHON_LINK_TARGET",
              ),
              (
                  Path("third_party/openriglogic/python/riglogic/CMakeLists.txt"),
                  "${PYRL}",
                  "PYRL_PYTHON_LINK_TARGET",
              ),
          ]

          for path, target, variable in operations:
              if not path.is_file():
                  raise FileNotFoundError(path)

              content = path.read_text(encoding="utf-8")

              marker = f"target_link_libraries({target}"
              old_link = "        Python3::Python)"

              if content.count(marker) != 1:
                  raise RuntimeError(f"Unexpected target marker in {path}")

              if content.count(old_link) != 1:
                  raise RuntimeError(f"Unexpected Python link in {path}")

              block = (
                  "if(TARGET Python3::Module)\n"
                  f"    set({variable} Python3::Module)\n"
                  "else()\n"
                  f"    set({variable} Python3::Python)\n"
                  "endif()\n"
              )

              replacement = f"        ${{{variable}}})"

              content = content.replace(marker, block + marker, 1)
              content = content.replace(old_link, replacement, 1)

              path.write_text(content, encoding="utf-8")
              print(f"Patched: {path}")

          print("OpenRigLogic Blender Python patch completed.")
          '@

          $script | python -


      - name: Configure OpenRigLogic
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python).Source
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build/openriglogic-blender"
          $stageDir = Join-Path $buildDir "stage"

          $cmakeArgs = @(
            "-S", "third_party/openriglogic",
            "-B", $buildDir,
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_INSTALL_PREFIX=$stageDir",
            "-DCMAKE_INSTALL_LIBDIR=lib",
            "-DRL_BUILD_PYTHON_WRAPPER=3.13",
            "-DRL_BUILD_TESTS=OFF",
            "-DRL_BUILD_EXAMPLES=OFF",
            "-DRL_BUILD_BENCHMARKS=OFF",
            "-DPython3_EXECUTABLE=$pythonExe"
          )

          & cmake @cmakeArgs

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build OpenRigLogic
        shell: pwsh
        run: |
          cmake --build build/openriglogic-blender --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install Python bindings
        shell: pwsh
        run: |
          cmake --install build/openriglogic-blender --config Release

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Test DNA reader
        shell: pwsh
        run: |
          $bindingDir = Join-Path $env:GITHUB_WORKSPACE "build/openriglogic-blender/stage/lib"

          $env:PYTHONPATH = "$bindingDir;$env:PYTHONPATH"
          $env:PATH = "$bindingDir;$env:PATH"

          @'
          from pathlib import Path
          from dna import BinaryStreamReader, DataLayer_All, FileStream, Status

          dna_path = Path("third_party/openriglogic/examples/Sample.dna")

          stream = FileStream(
              str(dna_path.resolve()),
              FileStream.AccessMode_Read,
              FileStream.OpenMode_Binary
          )

          reader = BinaryStreamReader(stream, DataLayer_All)
          reader.read()

          if not Status.isOk():
              raise RuntimeError(Status.get().message)

          print("DNA reader working!")
          print("Joint count:", reader.getJointCount())
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows DNA reader
        uses: actions/upload-artifact@v4
        with:
          name: openriglogic-windows-python313-x64
          path: build/openriglogic-blender/stage/lib/
          if-no-files-found: error
          retention-days: 14
